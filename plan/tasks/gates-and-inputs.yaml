      blocks: [M0-0.1, M0-0.6],
    }
  - {
      id: IN-02,
      name: 'Stitch to Figma export verified on her account (fallback per ADR-008 if not)',
      owner_external: 'Abdullah',
      week_due: 2,
      blocks: [M0-0.6, M0-0.8],
    }
  - {
      id: IN-03,
      name: 'Hosting free-tier account (Vercel, Netlify or Cloudflare Pages)',
      owner_external: 'Esraa',
      week_due: 12,
      blocks: [M4-4.8],
    }
  - {
      id: IN-04,
      name: 'Native Arabic reviewer available for P0 screens (plus an early look at three screens in week 2)',
      owner_external: 'Abdullah',
      week_due: 14,
      blocks: [M5-5.4],
    }
  - {
      id: IN-05,
      name: "Five real organizers (or friends running a gam'iya) to test the app",
      owner_external: 'Abdullah',
      week_due: 14,
      blocks: [M5-5.4],
    }
  - {
      id: IN-06,
      name: 'Two engineers for mock interviews and the 8-area rubric',
      owner_external: 'Abdullah',
      week_due: 15,
      blocks: [M5-5.7, G-M5],
    }

signoffs:
  - {
      id: SO-1,
      name: 'Gam3iya is the single project, now frontend-only for the 16 weeks',
      week_due: 1,
    }
  - { id: SO-2, name: 'Backend is out of the plan until the frontend gate (G-FE)', week_due: 1 }
  - {
      id: SO-3,
      name: 'Capacity: 8 independent hours per week and 2 live sessions of 90 minutes',
      week_due: 1,
    }
  - {
      id: SO-4,
      name: 'Tailwind v4 with Radix (ADR-003) and Next.js for public pages only (ADR-010)',
      week_due: 4,
    }
  - {
      id: SO-5,
      name: 'AI policy: tutor weeks 1 to 5, pair from week 6, Stitch and generated code are reference only',
      week_due: 1,
    }
  - { id: SO-6, name: 'Corrections UI (C5) is P1 in v2', week_due: 4 }
