# Schema: see M0.yaml
milestone: M2
title: TypeScript, domain, React 19 core
list: 'M2 · TypeScript, domain, React 19 core'
tasks:
  # ---------------------------------------------------------------- Track 2A: Domain (weeks 6-7)
  - id: M2-2.1
    name: 'TypeScript in practice: branded money and discriminated unions'
    track: 'Track 2A: Domain'
    owner: esraa
    work_type: domain
    base_hours: 2.5
    week: 6
    priority: urgent
    user_story: 'As a student developer, I want types that make illegal states unrepresentable, so that money and status bugs fail at compile time.'
    description: |
      Strict-mode exercises on circle types. Branded Piasters. Discriminated union for payment
      states. satisfies and as const for tables. Student-written zone: packages/domain.
    subtasks:
      - '2.1.1 Strict-mode exercises: narrowing, unions, generics (1)'
      - '2.1.2 Branded Piasters; discriminated union for payment states (1)'
      - '2.1.3 satisfies and as const for cycle-length and status tables (0.5)'
    acceptance_criteria:
      - 'Passing a plain number where Piasters is required fails typecheck'
      - 'A switch over payment state without an exhaustive branch fails typecheck'
      - 'No any and no non-null assertion without a comment'
    depends_on: [G-M0]
    refs: ['ADR-004', 'SRS NFR-MNT-03', 'AGENTS.md §5 TypeScript']
    tags: [typescript, types, domain]

  - id: M2-2.2
    name: 'Money and schedule, test first (A1, A2, A4)'
    track: 'Track 2A: Domain'
    owner: esraa
    work_type: domain
    base_hours: 3
    week: 6
    priority: urgent
    user_story: 'As an organizer, I want exact amounts and due dates, so that nobody argues about a pound or a day.'
    description: |
      Failing tests first from PRD Appendix A, then implementation. parseEgp uses string logic,
      never parseFloat. dueDate is computed from the start date, never chained.
    subtasks:
      - '2.2.1 Failing tests for A4: parse, sum, format (0.75)'
      - '2.2.2 Implement toPiasters, parseEgp, sum, formatEgp (0.5)'
      - '2.2.3 Failing tests for A1 and A2: weekly, biweekly, monthly, month-end clamp (0.75)'
      - '2.2.4 Implement dueDate(start, length, k) (1)'
    acceptance_criteria:
      - 'A4: 100050 piasters ten times totals 1,000,500 and formats as EGP 10,005.00'
      - 'A1: cycle 10 of the example is due 5 August 2027'
      - 'A2: 31 Jan, 28 Feb, 31 Mar 2027 for the monthly clamp'
      - 'Lint rule rejects floating-point money arithmetic'
    depends_on: [M2-2.1]
    refs: ['PRD A1, A2, A4', 'SRS BR-03, BR-04, FR-CIR-02']
    tags: [domain, tdd, money, schedule]

  - id: M2-2.3
    name: 'Payment status and payout rules, test first (A3, A5)'
    track: 'Track 2A: Domain'
    owner: esraa
    work_type: domain
    base_hours: 1.5
    week: 6
    priority: urgent
    user_story: 'As a member, I want lateness computed the same way everywhere, so that I never see a different answer on two screens.'
    description: |
      paymentView compares Cairo date strings and derives LATE; canRecordPayout requires a reason
      when any payment is unconfirmed. Functions take today as a parameter.
    subtasks:
      - '2.3.1 Failing tests for A3 boundary and A5 (0.5)'
      - '2.3.2 Implement paymentView and canRecordPayout (1)'
    acceptance_criteria:
      - 'A3: on time through 8 Nov 2026, late from 9 Nov 2026'
      - 'A5: nine of ten confirmed requires a reason and returns a flag'
      - 'No function reads the clock'
    depends_on: [M2-2.2]
    refs: ['PRD A3, A5, C3', 'SRS FR-PAY-06, FR-OUT-02']
    tags: [domain, tdd, lateness]

  - id: M2-2.4
    name: 'Harden the domain package and gate coverage at 90%'
    track: 'Track 2A: Domain'
    owner: esraa
    work_type: domain
    base_hours: 1
    week: 7
    priority: high
    user_story: 'As a mentor, I want edge cases and a coverage gate, so that business rules cannot regress silently.'
    description: |
      Edge cases: leap year, 30-day months, boundary days, Cairo date boundary. Coverage gate
      enforced in CI.
    subtasks:
      - '2.4.1 Add edge-case tests and the coverage gate in CI (1)'
    acceptance_criteria:
      - 'Coverage for packages/domain is 90% or higher in CI'
      - 'CI fails when coverage drops below the gate'
      - 'Leap-year and 30-day month cases have named tests'
    depends_on: [M2-2.3]
    refs: ['SRS NFR-MNT-01', 'PRD §8']
    tags: [coverage, domain]

  # ---------------------------------------------------------------- Track 2B: React 19 core (week 7)
  - id: M2-2.5
    name: 'React mental model: components, state, effects'
    track: 'Track 2B: React 19 core'
    owner: esraa
    work_type: react
    base_hours: 3
    week: 7
    priority: urgent
    user_story: 'As a student developer, I want a correct mental model of rendering, so that I stop fixing bugs by trial and error.'
    description: |
      Components and composition, state and derived values, lifting state, effects and
      cleanup. Build a CircleCard list from typed seed data with search and filter. Derive, do
      not sync.
    subtasks:
      - '2.5.1 Components, props, composition (0.75)'
      - '2.5.2 State, derived values, lifting state (0.75)'
      - '2.5.3 Effects: you might not need an effect, cleanup, dependencies (0.75)'
      - '2.5.4 CircleCard list with search and filter from typed seed (0.75)'
    acceptance_criteria:
      - 'No state that mirrors a prop or can be derived during render'
      - 'No data fetching or derived state inside useEffect'
      - 'She explains a render and a re-render at a whiteboard'
    depends_on: [M2-2.1, M1-1.5]
    refs: ['AGENTS.md §5 React 19', 'PRD D1']
    tags: [react, state, effects]

  - id: M2-2.6
    name: 'React 19 features: ref as prop, use, transitions'
    track: 'Track 2B: React 19 core'
    owner: esraa
    work_type: react
    base_hours: 3
    week: 7
    priority: high
    user_story: 'As a student developer, I want the current React 19 patterns, so that my code is modern and interview-ready.'
    description: |
      Ref as a prop, context through use, use with Suspense for a promise read, useTransition for
      tab switching, profiler first look. Read about useEffectEvent and Activity (added in 19.2).
    subtasks:
      - '2.6.1 Ref as a prop; context read with use (0.75)'
      - '2.6.2 use with Suspense for a promise-based read (0.75)'
      - '2.6.3 useTransition for tab switching (0.75)'
      - '2.6.4 React DevTools profiler first look; read useEffectEvent and Activity (0.75)'
    acceptance_criteria:
      - 'No forwardRef in new code'
      - 'Tab switch stays responsive while content loads'
      - 'Short note on when each 19.x feature applies'
    depends_on: [M2-2.5]
    refs: ['react.dev React 19 docs', 'AGENTS.md §5 React 19']
    tags: [react19, suspense, transitions]

