  - id: M5-5.1
    name: 'Next.js App Router: landing and invite preview pages'
    track: 'Track 5A: Next.js public pages'
    owner: esraa
    work_type: ui
    base_hours: 3.5
    week: 15
    priority: urgent
    user_story: 'As a visitor from WhatsApp, I want the landing and invite preview to load instantly with a proper link preview, so that I trust the link before opening it.'
    description: |
      Create apps/site sharing tokens and contracts. Landing S01 statically rendered with
      metadata and Open Graph. Invite preview shows only circle name, member count and cycle
      length, with generateMetadata. Comparison table of SSG, SSR and CSR for her own pages.
    subtasks:
      - '5.1.1 Create apps/site; share tokens and contracts (0.5)'
      - '5.1.2 Landing S01 static with metadata and Open Graph (1)'
      - '5.1.3 Invite preview with generateMetadata (1)'
      - '5.1.4 SSG, SSR, CSR comparison for her pages with reasons (1)'
    acceptance_criteria:
      - 'Landing is server rendered and has Open Graph tags'
      - 'Preview page exposes no member data (FR-PUB-02)'
      - 'Lighthouse 90 or higher in all four categories on both pages'
    depends_on: [G-M4]
    refs: ['SRS FR-PUB-01, FR-PUB-02, NFR-PRV-01', 'ADR-010', 'PRD S01, S12']
    tags: [nextjs, ssg, seo]

  - id: M5-5.2
    name: 'Server and client boundaries, streaming, route handler'
    track: 'Track 5A: Next.js public pages'
    owner: esraa
    work_type: ui
    base_hours: 3
    week: 15
    priority: high
    user_story: 'As a developer, I want to understand where code runs, so that I choose server or client deliberately.'
    description: |
      Server versus Client Components and where use client belongs, loading.tsx and error.tsx with
      Suspense streaming, one route handler serving seed data from contracts for the preview.
    subtasks:
      - '5.2.1 Server and Client Components: where use client goes and why (1)'
      - '5.2.2 loading.tsx, error.tsx, streaming (1)'
      - '5.2.3 Route handler serving seed data for the preview (1)'
    acceptance_criteria:
      - 'use client appears only where interactivity requires it, each with a reason'
      - 'Slow data streams behind a loading state'
      - 'She explains what runs on the server and in the browser for each page'
    depends_on: [M5-5.1]
    refs: ['ADR-010', 'SRS NFR-PERF-01']
    tags: [nextjs, rsc, streaming]

